<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DOS Game Player</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    #uploader {
      padding: 20px;
      max-width: 90%;
    }
    #dosbox {
      width: 100%;
      max-width: 640px;
      height: 70vh;
      border: 2px solid #333;
      display: none;
    }
    input[type="file"] {
      margin-top: 10px;
      padding: 8px;
      width: 80%;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="uploader">
    <h2>Загрузи ZIP с DOS-игрой</h2>
    <p>Архив должен содержать .exe файл в корне (без папок внутри).</p>
    <input type="file" id="zipFile" accept=".zip" />
    <br />
    <button id="startBtn" disabled>Запустить игру</button>
  </div>
  <div id="dosbox">Запуск...</div>

  <script type="module">
    import { Dos } from "https://cdn.jsdelivr.net/npm/js-dos@7.0.3/dist/js-dos.js";

    const zipInput = document.getElementById("zipFile");
    const startBtn = document.getElementById("startBtn");
    const uploader = document.getElementById("uploader");
    const dosbox = document.getElementById("dosbox");

    let selectedFile = null;

    zipInput.addEventListener("change", (e) => {
      selectedFile = e.target.files[0];
      startBtn.disabled = !selectedIt;
      if (selectedFile) {
        startBtn.disabled = false;
      }
    });

    startBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      // Показываем эмулятор
      uploader.style.display = "none";
      dosbox.style.display = "block";

      try {
        // Запускаем DOS
        await Dos(dosbox).ready(async (fs) => {
          // Загружаем файл в виртуальную ФС
          const arrayBuf = await selectedFile.arrayBuffer();
          await fs.upload("game.zip", new Uint8Array(arrayBuf));

          // Распаковываем
          await fs.extract("game.zip");

          // Ищем .exe
          const files = await fs.list("/");
          const exeFile = files.find(f => f.toLowerCase().endsWith('.exe'));

          if (!exeFile) {
            throw new Error("Не найден .exe файл в архиве!");
          }

          // Запускаем игру (без звука — чтобы не висла)
          await fs.run(exeFile, ["-nosound"]);
        });
      } catch (err) {
        dosbox.innerText = "❌ Ошибка:\n" + err.message;
        console.error(err);
      }
    });
  </script>
</body>
</html>
